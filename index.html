<meta property="og:title" content="Drzwi BHP – RadTom (dawniej AGART)">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1623;--navy:#12213a;--navy2:#1b2f4f;--steel:#64748b;--paper:#f6f3ec;--white:#fff;--line:#e2ddd1;--brass:#b08d4f;--brass2:#d4b176;--ok:#2f7d5b;--err:#b3382c;--sh:0 12px 34px rgba(14,22,35,.09)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:16px/1.65 Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.08;letter-spacing:.005em}
img{max-width:100%;display:block}a{color:inherit}button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.sec{padding:96px 0;scroll-margin-top:72px}.sec.alt{background:var(--white)}
.eyebrow{display:flex;align-items:center;gap:14px;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);font-weight:600;margin-bottom:16px}
.eyebrow:before{content:"";width:38px;height:1px;background:var(--brass)}
.sec h2{font-size:clamp(2rem,4.2vw,3.1rem);margin-bottom:18px}
.lead{color:var(--steel);max-width:640px;font-size:1.05rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 28px;border:1px solid transparent;border-radius:3px;font-weight:600;font-size:.95rem;letter-spacing:.02em;text-decoration:none;transition:.2s;background:none;color:inherit}
.btn.gold{background:var(--brass2);color:var(--navy)}.btn.gold:hover{background:#e3c387;transform:translateY(-1px)}
.btn.ghost{border-color:rgba(255,255,255,.4);color:#fff}.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.dark{background:var(--navy);color:#fff}.btn.dark:hover{background:var(--navy2)}
.btn.line{border-color:var(--navy);color:var(--navy)}.btn.line:hover{background:var(--navy);color:#fff}
.btn.sm{padding:10px 16px;font-size:.86rem}
/* header */
.hd{position:sticky;top:0;z-index:50;background:rgba(18,33,58,.96);backdrop-filter:blur(8px);border-bottom:1px solid rgba(212,177,118,.25)}
.hd .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;gap:20px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
.logo svg{flex:none}.logo b{font-family:'Cormorant Garamond',serif;font-size:1.65rem;letter-spacing:.14em;font-weight:700;line-height:1}
.logo small{display:block;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass2);margin-top:4px;font-family:Inter}
.nav{display:flex;align-items:center;gap:30px}
.nav a{color:#d9e0ea;text-decoration:none;font-size:.9rem;letter-spacing:.04em}.nav a:hover{color:var(--brass2)}
.nav .btn{color:var(--navy)}
.burger{display:none;background:none;border:0;color:#fff;font-size:1.7rem}
/* hero */
.hero{position:relative;background:linear-gradient(135deg,#0c1829,var(--navy) 55%,var(--navy2));color:#fff;overflow:hidden}
.hero.img:before{content:"";position:absolute;inset:0;background:var(--hi) center/cover;opacity:.38}
.hero.img:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,24,41,.92),rgba(12,24,41,.55))}
.hero .wrap{position:relative;z-index:2;padding-top:104px;padding-bottom:150px;display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center}
.seal{display:inline-flex;align-items:center;gap:12px;border:1px solid var(--brass2);color:var(--brass2);padding:9px 18px;border-radius:40px;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;margin-bottom:30px}
.seal i{width:7px;height:7px;background:var(--brass2);border-radius:50%}
.hero h1{font-size:clamp(2.5rem,5.6vw,4.4rem);margin-bottom:24px;max-width:780px}
.hero p{color:#c3cddb;font-size:1.12rem;max-width:600px;margin-bottom:38px}
.hero .cta{display:flex;flex-wrap:wrap;gap:14px}
.hero-art{position:relative;z-index:2;display:flex;justify-content:center}
.hero.img .hero-art{display:none}
/* stats */
.stats{position:relative;z-index:5;margin-top:-72px;background:var(--white);border:1px solid var(--line);box-shadow:var(--sh);display:grid;grid-template-columns:repeat(4,1fr);border-radius:4px}
.stat{padding:34px 26px;text-align:center;border-right:1px solid var(--line)}.stat:last-child{border:0}
.stat b{display:block;font-family:'Cormorant Garamond',serif;font-size:2.7rem;color:var(--navy);line-height:1.05;font-weight:700}
.stat span{display:block;margin-top:8px;font-size:.86rem;color:var(--steel)}
/* catalogue */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:34px 0 38px}
.chip{border:1px solid var(--line);background:var(--white);padding:9px 20px;border-radius:40px;font-size:.88rem;color:var(--navy);transition:.2s}
.chip:hover{border-color:var(--brass)}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:28px}
.card{background:var(--white);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;transition:.25s;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:var(--brass2)}
.ph{position:relative;aspect-ratio:4/4.6;background:#e9e5db;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;transition:.5s}.card:hover .ph img{transform:scale(1.04)}
.bdg{position:absolute;left:14px;top:14px;background:var(--navy);color:var(--brass2);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;font-weight:600;border-radius:2px}
.cb{padding:22px 22px 24px;display:flex;flex-direction:column;gap:10px;flex:1}
.cat{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);font-weight:600}
.card h3{font-size:1.6rem;color:var(--navy)}
.card p{color:var(--steel);font-size:.92rem}
.dims{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px;font-size:.84rem}
.dims div{display:flex;justify-content:space-between;gap:10px}.dims dt{color:var(--steel)}.dims dd{font-weight:600;color:var(--navy);text-align:right}
.ca{display:flex;gap:10px;margin-top:14px}.ca .btn{flex:1;padding:11px 10px}
.empty{padding:60px 20px;text-align:center;border:1px dashed var(--line);color:var(--steel);background:var(--white)}
/* about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center}
.about p{color:#47556a;margin-bottom:18px}
.aimg{position:relative}.aimg img,.aimg .aph{width:100%;aspect-ratio:4/4.4;object-fit:cover;border-radius:3px}
.aimg:before{content:"";position:absolute;inset:-14px 14px 14px -14px;border:1px solid var(--brass);border-radius:3px;z-index:0}
.aimg img,.aimg .aph{position:relative;z-index:1}
.aph{background:linear-gradient(135deg,var(--navy),var(--navy2));display:flex;align-items:center;justify-content:center}
.timeline{display:flex;gap:0;margin-top:30px;border-top:1px solid var(--line)}
.tl{flex:1;padding:20px 20px 0 0;position:relative}.tl:before{content:"";position:absolute;top:-5px;left:0;width:9px;height:9px;border-radius:50%;background:var(--brass)}
.tl b{font-family:'Cormorant Garamond',serif;font-size:1.9rem;color:var(--navy);display:block;line-height:1}.tl span{font-size:.86rem;color:var(--steel)}
/* features + steps */
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:46px}
.feat{padding:34px 30px;border:1px solid var(--line);background:var(--paper);border-radius:4px}
.feat i{font-style:normal;font-family:'Cormorant Garamond',serif;font-size:2.6rem;color:var(--brass);line-height:1;display:block;margin-bottom:12px}
.feat h3{font-size:1.5rem;color:var(--navy);margin-bottom:10px}.feat p{color:var(--steel);font-size:.95rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:46px;counter-reset:s}
.step{padding:0 26px 0 0;position:relative}.step:before{counter-increment:s;content:"0" counter(s);font-family:'Cormorant Garamond',serif;font-size:3.4rem;color:var(--brass2);display:block;line-height:1;margin-bottom:10px}
.step h3{font-size:1.4rem;color:var(--navy);margin-bottom:8px}.step p{font-size:.93rem;color:var(--steel)}
/* contact */
.contact{background:var(--navy);color:#fff}
.contact .eyebrow{color:var(--brass2)}.contact .eyebrow:before{background:var(--brass2)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:stretch}
.cl{display:grid;gap:26px;margin-top:34px}.cl div small{display:block;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass2);margin-bottom:4px}
.cl a,.cl span{font-size:1.15rem;text-decoration:none}.cl .big{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:600}
.map{min-height:340px;border:1px solid rgba(212,177,118,.35);border-radius:3px;overflow:hidden;background:var(--navy2)}
.map iframe{width:100%;height:100%;min-height:340px;border:0;filter:grayscale(.7) contrast(1.05)}
.callbox{padding:46px;border:1px solid rgba(212,177,118,.35);display:flex;flex-direction:column;justify-content:center;gap:18px;height:100%}
.callbox h3{font-size:2rem}.callbox p{color:#c3cddb}
footer{background:#0a1322;color:#8f9db1;font-size:.85rem;padding:30px 0}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}footer a{color:#aab6c6}
#mbar{display:none}
/* modal */
#modal{position:fixed;inset:0;z-index:80;background:rgba(8,14,24,.72);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 16px;backdrop-filter:blur(3px)}
#modal.on{display:flex}
.mbox{background:var(--white);border-radius:4px;max-width:1040px;width:100%;position:relative;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.mx{position:absolute;right:14px;top:10px;font-size:2rem;background:none;border:0;color:var(--navy);z-index:3;line-height:1}
.gal{padding:26px;background:#efebe1}.gal .main{aspect-ratio:4/4.8;background:#e2ddd1;overflow:hidden;border-radius:3px}.gal .main img{width:100%;height:100%;object-fit:contain;background:#fff}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.thumbs img{width:62px;height:76px;object-fit:cover;border:2px solid transparent;border-radius:2px;cursor:pointer;opacity:.7}.thumbs img.on{border-color:var(--brass);opacity:1}
.mi{padding:40px 36px 34px}.mi h2{font-size:2.4rem;color:var(--navy);margin:6px 0 10px}.mi .price{font-weight:600;color:var(--brass);margin-bottom:14px}
.mi .desc{color:#47556a;font-size:.96rem;white-space:pre-line;margin-bottom:22px}
.mi h4{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin:22px 0 8px}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}.t th,.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}.t th{font-weight:500;color:var(--steel);font-size:.78rem}.t td{font-weight:600;color:var(--navy)}
.t.kv th{width:46%;font-size:.88rem}
.mcta{display:flex;flex-direction:column;gap:10px;margin-top:26px}
/* ---- admin ---- */
#admin{position:fixed;inset:0;z-index:100;background:#f1eee7;display:none;overflow:auto;font-size:15px}
#admin.on{display:block}
.a-top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 22px;gap:12px}
.a-top b{font-size:1.35rem}.a-top a{text-decoration:none}
.a-body{display:grid;grid-template-columns:220px 1fr;gap:26px;max-width:1240px;margin:0 auto;padding:26px 22px 80px}
.a-nav{display:flex;flex-direction:column;gap:6px;position:sticky;top:78px;align-self:start}
.a-nav button{text-align:left;padding:12px 16px;border:1px solid var(--line);background:#fff;border-radius:4px;color:var(--navy);font-weight:500}
.a-nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.a-btn{display:inline-block;padding:9px 16px;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:3px;font-weight:600;font-size:.88rem;text-decoration:none}
.a-btn.pri{background:var(--brass2);border-color:var(--brass2)}.a-btn.dng{border-color:var(--err);color:var(--err)}
.a-top .a-btn{background:none;color:#fff;border-color:rgba(255,255,255,.4)}
.a-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.a-head h2{font-size:2rem;color:var(--navy)}.a-head small{font-size:1rem;color:var(--steel)}
.a-card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:24px;margin-bottom:20px}
.a-card h3{font-size:1.4rem;color:var(--navy);margin-bottom:14px}
.a-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}.a-grid .full{grid-column:1/-1}
.a-card label{display:block;font-size:.8rem;color:var(--steel);font-weight:500}
.a-card input[type=text],.a-card input[type=number],.a-card input:not([type]),.a-card select,.a-card textarea{width:100%;margin-top:5px;padding:10px 12px;border:1px solid #cfc9bb;border-radius:3px;font:inherit;color:var(--ink);background:#fff}
.a-card textarea{min-height:110px;resize:vertical}.a-card input:focus,.a-card textarea:focus,.a-card select:focus{outline:2px solid var(--brass2);border-color:var(--brass)}
.a-hint{font-size:.78rem;color:var(--steel);margin-top:4px}
.a-list{display:grid;gap:10px}.a-row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:4px}
.a-row img{width:54px;height:64px;object-fit:cover;border-radius:2px;background:#ddd;flex:none}.a-ri{flex:1;min-width:0}.a-ri b{display:block;color:var(--navy)}.a-ri span{font-size:.82rem;color:var(--steel)}
.a-ra{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.a-ra button{padding:7px 11px;border:1px solid #cfc9bb;background:#fff;border-radius:3px;font-size:.8rem}.a-ra button:disabled{opacity:.35}.a-ra .del{color:var(--err);border-color:#e4b9b3}
.a-empty{padding:40px;text-align:center;background:#fff;border:1px dashed #cfc9bb;color:var(--steel)}
.a-ph{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}.a-pi{width:120px;position:relative}.a-pi img{width:120px;height:150px;object-fit:cover;border:1px solid var(--line);border-radius:3px}
.a-pi .tag{position:absolute;left:6px;top:6px;background:var(--navy);color:var(--brass2);font-size:.65rem;padding:3px 7px;border-radius:2px}
.a-pi div{display:flex;justify-content:space-between;margin-top:4px}.a-pi button{border:1px solid #cfc9bb;background:#fff;border-radius:3px;padding:3px 8px;font-size:.8rem}
.a-vr{display:grid;grid-template-columns:1.2fr repeat(4,1fr) auto;gap:8px;align-items:end;margin-bottom:10px}
.a-sr{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:end;margin-bottom:10px}
.a-x{border:1px solid #e4b9b3;background:#fff;color:var(--err);border-radius:3px;padding:10px 12px}
.a-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.a-chips button{border:1px solid #cfc9bb;background:#faf8f3;border-radius:30px;padding:5px 12px;font-size:.78rem}
.a-save{position:sticky;bottom:0;background:linear-gradient(transparent,#f1eee7 30%);padding:20px 0 6px;display:flex;gap:10px}
.a-warn{background:#fff6dd;border:1px solid #ecd48b;padding:12px 16px;border-radius:4px;margin-bottom:18px;font-size:.88rem}
.a-login{max-width:440px;margin:90px auto;background:#fff;padding:40px;border:1px solid var(--line);text-align:center}
.a-login h2{color:var(--navy);margin-bottom:12px;font-size:2rem}.a-login p{color:var(--steel);margin-bottom:22px}
.a-mut{color:var(--steel)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;background:var(--navy);color:#fff;padding:13px 24px;border-radius:4px;display:none;box-shadow:var(--sh);max-width:90vw}
#toast.err{background:var(--err)}#toast.on{display:block}
#bar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--brass2);z-index:300;transition:width .3s}
body.busy #bar{width:80%}
@media(max-width:980px){
 .hero .wrap{grid-template-columns:1fr;padding-top:64px;padding-bottom:120px}.hero-art{display:none}
 .stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
 .about,.cgrid{grid-template-columns:1fr;gap:44px}.feats{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr;gap:32px 0}
 .mbox{grid-template-columns:1fr}.sec{padding:70px 0}
 .nav{position:absolute;top:72px;left:0;right:0;background:var(--navy);flex-direction:column;align-items:flex-start;padding:20px 24px;gap:18px;display:none;border-bottom:1px solid rgba(212,177,118,.25)}.nav.open{display:flex}.burger{display:block}
 #mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--navy);padding:10px 14px;border-top:1px solid var(--brass)}#mbar .btn{width:100%}
 body{padding-bottom:64px}
 .a-body{grid-template-columns:1fr}.a-nav{position:static;flex-direction:row;flex-wrap:wrap}
 .a-vr{grid-template-columns:1fr 1fr}.a-grid{grid-template-columns:1fr}
}
@media(max-width:560px){.timeline{flex-direction:column;gap:6px;border-top:0;border-left:1px solid var(--line)}.tl{padding:0 0 18px 20px}.tl:before{left:-5px;top:6px}.steps{grid-template-columns:1fr}.callbox{padding:30px 24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="bar"></div>
<header class="hd">
 <div class="wrap">
  <a class="logo" href="#top" id="logo"></a>
  <button class="burger" id="burger" aria-label="Menu">☰</button>
  <nav class="nav" id="nav">
   <a href="#oferta">Oferta</a><a href="#firma">O firmie</a><a href="#atuty">Dlaczego my</a><a href="#kontakt">Kontakt</a><span id="navcall"></span>
  </nav>
 </div>
</header>
<main id="top">
 <section class="hero" id="hero"></section>
 <div class="wrap"><div class="stats" id="stats"></div></div>
 <section class="sec" id="oferta"><div class="wrap">
  <div class="eyebrow">Oferta</div><h2>Drzwi BHP w naszej ofercie</h2>
  <p class="lead">Przy każdym modelu podajemy szerokość i wysokość skrzydła oraz wymiary montażowe, żebyś od razu wiedział, czy drzwi pasują do Twojego otworu.</p>
  <div class="filters" id="filters"></div><div class="grid" id="grid"></div>
 </div></section>
 <section class="sec alt" id="firma"><div class="wrap about" id="about"></div></section>
 <section class="sec" id="atuty"><div class="wrap">
  <div class="eyebrow">Dlaczego my</div><h2>Wiemy, co robimy</h2>
  <div class="feats" id="feats"></div>
  <div style="height:70px"></div>
  <div class="eyebrow">Jak zamówić</div><h2>Od telefonu do gotowych drzwi</h2>
  <div class="steps" id="steps"></div>
 </div></section>
 <section class="sec contact" id="kontakt"><div class="wrap cgrid" id="contact"></div></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>
<div id="mbar"></div>
<div id="modal"></div>
<div id="admin"></div>
<div id="toast"></div>

function MemDB(seed){
 const st={main:seed?{phone:'+48 600 000 000',address:'ul. Przykładowa 1, 00-000 Miasto'}:{},images:{hero:'',about:''},prods:seed?structuredClone(SEED):[],photos:{}};
 let n=100;
 return{
  async settings(){return{main:st.main,images:st.images}},
  async saveMain(o){st.main=structuredClone(o)},async saveImages(o){st.images={...st.images,...o}},
  async products(all){return structuredClone(st.prods.filter(p=>all||p.visible))},
  async photo(id){return st.photos[id]||''},
  async addPhoto(d){const id='p'+(++n);st.photos[id]=d;return id},
  async delPhoto(id){delete st.photos[id]},
  async saveProduct(id,o){if(!id){id='d'+(++n);st.prods.push({...o,id});}else{const i=st.prods.findIndex(p=>p.id===id);st.prods[i]={...o,id}}return id},
  async patch(id,o){Object.assign(st.prods.find(p=>p.id===id),o)},
  async delProduct(id){st.prods=st.prods.filter(p=>p.id!==id)},
  async exportAll(){return structuredClone({main:st.main,images:st.images,products:st.prods,photos:st.photos})},
  async importAll(o){st.main=o.main||{};st.images=o.images||{};st.prods=o.products||[];st.photos=o.photos||{}}
 };
}
function LiveDB(){
 const{doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,collection,query,where}=FS;
 return{
  async settings(){const[a,b]=await Promise.all([getDoc(doc(db,'settings','main')),getDoc(doc(db,'settings','images'))]);return{main:a.exists()?a.data():{},images:b.exists()?b.data():{}}},
  async saveMain(o){await setDoc(doc(db,'settings','main'),o)},
  async saveImages(o){await setDoc(doc(db,'settings','images'),o,{merge:true})},
  async products(all){const r=await getDocs(all?collection(db,'products'):query(collection(db,'products'),where('visible','==',true)));return r.docs.map(d=>({...d.data(),id:d.id}))},
  async photo(id){const d=await getDoc(doc(db,'photos',id));return d.exists()?d.data().data:''},
  async addPhoto(data){return(await addDoc(collection(db,'photos'),{data,t:Date.now()})).id},
  async delPhoto(id){await deleteDoc(doc(db,'photos',id))},
  async saveProduct(id,o){if(id){await setDoc(doc(db,'products',id),o);return id}return(await addDoc(collection(db,'products'),o)).id},
  async patch(id,o){await updateDoc(doc(db,'products',id),o)},
  async delProduct(id){await deleteDoc(doc(db,'products',id))},
  async exportAll(){const[s,pr,ph]=await Promise.all([this.settings(),this.products(true),getDocs(collection(db,'photos'))]);const photos={};ph.docs.forEach(d=>photos[d.id]=d.data().data);return{main:s.main,images:s.images,products:pr,photos}},
  async importAll(o){await setDoc(doc(db,'settings','main'),o.main||{});await setDoc(doc(db,'settings','images'),o.images||{});for(const[id,d]of Object.entries(o.photos||{}))await setDoc(doc(db,'photos',id),{data:d,t:Date.now()});for(const p of o.products||[]){const{id,...r}=p;await setDoc(doc(db,'products',id),r)}}
 };
}

async function resize(src,max,q,limit){
 const blob=typeof src==='string'?await(await fetch(src)).blob():src;
 const bmp=await createImageBitmap(blob);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
 const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
 let out=c.toDataURL('image/jpeg',q);while(out.length>limit&&q>.4){q-=.07;out=c.toDataURL('image/jpeg',q)}return out;
}

   <div class="price">${p.price?esc(p.price):'Cena: zapytaj telefonicznie'}</div>

   ${vs.length?`<h4>Wymiary (mm)</h4><table class="t"><tr>${named?'<th>Wariant</th>':''}<th>Skrzydło szer.</th><th>Skrzydło wys.</th><th>Montaż szer.</th><th>Montaż wys.</th></tr>${vs.map(v=>`<tr>${named?`<td>${esc(v.name)}</td>`:''}<td>${esc(v.leafW||'–')}</td><td>${esc(v.leafH||'–')}</td><td>${esc(v.mountW||'–')}</td><td>${esc(v.mountH||'–')}</td></tr>`).join('')}</table>`:''}
   ${(p.specs||[]).length?`<h4>Parametry</h4><table class="t kv">${p.specs.map(s=>`<tr><th>${esc(s.k)}</th><td>${esc(s.v)}</td></tr>`).join('')}</table>`:''}
   <div class="mcta">${call('gold','Zadzwoń i zamów: '+esc(S.phone))}${S.email?`<a class="btn line" href="mailto:${esc(S.email)}?subject=${subj}">Wyślij zapytanie e-mail</a>`:''}</div></div></div>`;
 m.classList.add('on');document.body.style.overflow='hidden';
 const close=()=>{m.classList.remove('on');document.body.style.overflow='';history.replaceState(null,'',location.pathname+location.search)};
 $('.mx',m).onclick=close;m.onclick=e=>{if(e.target===m)close()};
 m._close=close;

  const imgs=(await Promise.all(p.photoIds.map(getPhoto))).filter(Boolean);

   if(imgs.length>1){$('#thumbs').innerHTML=imgs.map((s,i)=>`<img src="${s}" class="${i?'':'on'}" alt="">`).join('');
    $$('#thumbs img').forEach(t=>t.onclick=()=>{$('#mainImg').src=t.src;$$('#thumbs img').forEach(x=>x.classList.toggle('on',x===t))})}
  }
 }

const toast=(m,t)=>{const e=$('#toast');e.textContent=m;e.className='on'+(t==='err'?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',3800)};
const busy=b=>document.body.classList.toggle('busy',b);
if(!DEMO&&!initErr){A.onAuthStateChanged(auth,async u=>{user=u;isAdm=false;
 if(u){try{isAdm=(await FS.getDoc(FS.doc(db,'admins',u.email))).exists()}catch(e){console.warn(e)}}
 authReady=true;if($('#admin').classList.contains('on'))renderAdmin()})}
function openAdmin(){$('#admin').classList.add('on');document.body.style.overflow='hidden';history.replaceState(null,'','#admin');renderAdmin()}
function closeAdmin(){$('#admin').classList.remove('on');document.body.style.overflow='';history.replaceState(null,'',location.pathname+location.search);load()}
function renderAdmin(){
 const a=$('#admin');
 const top=`<div class="a-top"><b class="serif">${esc(S.brand)} · panel administratora</b><div><a class="a-btn" href="#" data-act="close">Zobacz stronę</a> ${user?'<button class="a-btn" data-act="logout">Wyloguj</button>':''}</div></div>`;
 if(!authReady){a.innerHTML=top+'<div class="a-login"><p>Ładowanie…</p></div>';return}
 if(initErr){a.innerHTML=top+'<div class="a-login"><h2>Błąd połączenia</h2><p>Nie udało się wczytać Firebase. Sprawdź połączenie lub wyłącz blokadę reklam dla tej strony.</p></div>';return}
 if(!DEMO&&!user){a.innerHTML=top+'<div class="a-login"><h2>Logowanie</h2><p>Zaloguj się kontem Google administratora.</p><button class="a-btn pri" data-act="login">Zaloguj przez Google</button></div>';return}
 if(!DEMO&&!isAdm){a.innerHTML=top+`<div class="a-login"><h2>Brak uprawnień</h2><p>Konto ${esc(user.email)} nie jest administratorem tej strony.</p><button class="a-btn" data-act="logout">Zmień konto</button></div>`;return}
 a.innerHTML=top+`<div class="a-body"><div class="a-nav">${[['prod','Produkty'],['site','Dane i teksty'],['img','Zdjęcia strony'],['bak','Kopia zapasowa']].map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div><div id="aMain"></div></div>`;
 showTab();
}
async function showTab(){
 $$('.a-nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 const m=$('#aMain');
 const warn=[DEMO?'<div class="a-warn"><b>Tryb podglądu.</b> Zmiany działają tylko do odświeżenia strony. Aby zapisywać na stałe, wklej konfigurację Firebase do index.html.</div>':'',(!S.phone&&tab!=='site')?'<div class="a-warn">Nie ustawiono numeru telefonu. Przyciski „Zadzwoń” są ukryte, dopóki nie wpiszesz go w zakładce <b>Dane i teksty</b>.</div>':''].join('');
 if(tab==='prod'){ed=null;await viewProducts(warn)}
 else if(tab==='site')viewSite(warn);else if(tab==='img')viewImages(warn);else viewBackup(warn);
}
const FLD=(l,k,v,o={})=>`<label class="${o.full?'full':''}">${l}${o.area?`<textarea data-k="${k}" ${o.lines?'data-t="lines"':''}>${esc(v)}</textarea>`:`<input type="${o.type||'text'}" data-k="${k}" value="${esc(v)}" ${o.ph?`placeholder="${esc(o.ph)}"`:''}>`}${o.hint?`<div class="a-hint">${o.hint}</div>`:''}</label>`;
function bind(root,obj){
 const h=e=>{const t=e.target;
  if(t.dataset.k){let v=t.type==='checkbox'?t.checked:t.value;if(t.dataset.t==='lines')v=v.split('\n').map(x=>x.trim()).filter(Boolean);if(t.type==='number'&&t.dataset.k==='since')v=+v;obj[t.dataset.k]=v}
  else if(t.dataset.l){obj[t.dataset.l][+t.dataset.i][t.dataset.f]=t.value}};
 root.oninput=h;root.onchange=h;
}
/* --- produkty --- */
async function viewProducts(warn=''){
 const m=$('#aMain');m.innerHTML=warn+'<p class="a-mut">Ładowanie…</p>';
 let list=[];try{list=(await DB.products(true)).sort((a,b)=>(a.order||0)-(b.order||0))}catch(e){m.innerHTML=warn+'<div class="a-warn">Nie udało się pobrać produktów: '+esc(e.message)+'</div>';return}
 listCache=list;
 m.innerHTML=warn+`<div class="a-head"><h2>Produkty <small>(${list.length})</small></h2><button class="a-btn pri" data-act="newp">+ Dodaj produkt</button></div>`+
 (list.length?`<div class="a-list">${list.map((p,i)=>`<div class="a-row"><img src="${p.thumb||PH}" alt=""><div class="a-ri"><b>${esc(p.name)}</b><span>${esc(p.category||'bez kategorii')}${p.visible?'':' · <em>ukryty</em>'}</span></div><div class="a-ra"><button data-act="up" data-id="${p.id}" ${i?'':'disabled'}>↑</button><button data-act="dn" data-id="${p.id}" ${i<list.length-1?'':'disabled'}>↓</button><button data-act="vis" data-id="${p.id}">${p.visible?'Ukryj':'Pokaż'}</button><button data-act="edit" data-id="${p.id}">Edytuj</button><button class="del" data-act="del" data-id="${p.id}">Usuń</button></div></div>`).join('')}</div>`:'<div class="a-empty">Nie ma jeszcze produktów. Kliknij „Dodaj produkt”.</div>');
}
const SPEC_PRESETS=['Odporność ogniowa','Dymoszczelność','Grubość skrzydła','Ościeżnica','Wypełnienie','Kolor','Zamek / zamknięcie','Certyfikat / atest','Waga'];
async function editProduct(id){
 const m=$('#aMain');m.innerHTML='<p class="a-mut">Ładowanie…</p>';busy(true);
 const base=id?structuredClone(listCache.find(p=>p.id===id)):{name:'',category:(S.categories||[])[0]||'',short:'',desc:'',price:'',badge:'',visible:true,order:(Math.max(0,...listCache.map(p=>p.order||0))+1),variants:[{name:'',leafW:'',leafH:'',mountW:'',mountH:''}],specs:[]};
 base.variants=base.variants||[];base.specs=base.specs||[];
 const photos=[];for(const pid of base.photoIds||[]){const src=await DB.photo(pid);if(src)photos.push({id:pid,src})}
 busy(false);ed={id:id||null,f:base,photos,removed:[]};drawEditor();
}
function drawEditor(){
 const f=ed.f,cats=[...(S.categories||[])];if(f.category&&!cats.includes(f.category))cats.push(f.category);
 const m=$('#aMain');
 m.innerHTML=`<div class="a-head"><h2>${ed.id?'Edycja produktu':'Nowy produkt'}</h2><button class="a-btn" data-act="back">← Wróć do listy</button></div>
 <div class="a-card" id="edBase"><h3>Podstawowe informacje</h3><div class="a-grid">
  ${FLD('Nazwa produktu *','name',f.name,{full:true})}
  <label>Kategoria<select data-k="category">${cats.map(c=>`<option ${c===f.category?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
  ${FLD('Plakietka na zdjęciu (opcjonalnie)','badge',f.badge,{ph:'np. Nowość, Dostępne od ręki'})}
  ${FLD('Cena (opcjonalnie)','price',f.price,{ph:'np. od 1 890 zł netto. Puste = „zapytaj telefonicznie”'})}
  ${FLD('Kolejność na liście','order',f.order,{type:'number'})}
  ${FLD('Krótki opis (na karcie produktu)','short',f.short,{area:true,full:true})}
  ${FLD('Pełny opis (w oknie szczegółów)','desc',f.desc,{area:true,full:true})}
  <label class="full"><input type="checkbox" data-k="visible" ${f.visible?'checked':''}> Widoczny na stronie</label></div></div>
 <div class="a-card"><h3>Zdjęcia</h3><div class="a-ph" id="edPh"></div><input type="file" id="edFile" accept="image/*" multiple><div class="a-hint">Pierwsze zdjęcie jest główne (widać je na karcie). Zdjęcia są automatycznie zmniejszane.</div></div>
 <div class="a-card"><h3>Wymiary (w mm)</h3><div id="edVar"></div><button class="a-btn" data-act="addvar">+ Dodaj wariant wymiarowy</button></div>
 <div class="a-card"><h3>Dodatkowe parametry</h3><div id="edSpec"></div><div class="a-chips">${SPEC_PRESETS.map(s=>`<button data-act="addspec" data-k="${esc(s)}">+ ${esc(s)}</button>`).join('')}</div><button class="a-btn" data-act="addspec" data-k="">+ Własny parametr</button></div>
 <div class="a-save"><button class="a-btn pri" data-act="savep">Zapisz produkt</button><button class="a-btn" data-act="back">Anuluj</button></div>`;
 bind($('#edBase'),f);drawPh();drawVar();drawSpec();
 $('#edFile').onchange=async e=>{busy(true);try{for(const file of e.target.files)ed.photos.push({id:null,src:await resize(file,1600,.8,650000)})}catch(x){toast('Nie udało się wczytać zdjęcia','err')}busy(false);e.target.value='';drawPh()};
}
function drawPh(){$('#edPh').innerHTML=ed.photos.map((p,i)=>`<div class="a-pi"><img src="${p.src}" alt="">${i===0?'<span class="tag">GŁÓWNE</span>':''}<div><button data-act="phl" data-i="${i}" ${i?'':'disabled'}>←</button><button data-act="phr" data-i="${i}" ${i<ed.photos.length-1?'':'disabled'}>→</button><button data-act="phx" data-i="${i}">✕</button></div></div>`).join('')||'<span class="a-mut">Brak zdjęć</span>'}
function drawVar(){const b=$('#edVar');b.innerHTML=ed.f.variants.map((v,i)=>`<div class="a-vr">${['name:Wariant (opc.)','leafW:Szer. skrzydła','leafH:Wys. skrzydła','mountW:Szer. montażowa','mountH:Wys. montażowa'].map(s=>{const[k,l]=s.split(':');return`<label>${l}<input data-l="variants" data-i="${i}" data-f="${k}" value="${esc(v[k])}"></label>`}).join('')}<button class="a-x" data-act="delvar" data-i="${i}">✕</button></div>`).join('');bind(b,ed.f)}
function drawSpec(){const b=$('#edSpec');b.innerHTML=ed.f.specs.map((s,i)=>`<div class="a-sr"><label>Parametr<input data-l="specs" data-i="${i}" data-f="k" value="${esc(s.k)}"></label><label>Wartość<input data-l="specs" data-i="${i}" data-f="v" value="${esc(s.v)}"></label><button class="a-x" data-act="delspec" data-i="${i}">✕</button></div>`).join('');bind(b,ed.f)}
async function saveProduct(){
 const f=ed.f;if(!String(f.name).trim()){toast('Podaj nazwę produktu','err');return}
 busy(true);
 try{
  const ids=[];for(const p of ed.photos){if(!p.id)p.id=await DB.addPhoto(p.src);ids.push(p.id)}
  for(const id of ed.removed)await DB.delPhoto(id);ed.removed=[];
  const thumb=ed.photos[0]?await resize(ed.photos[0].src,600,.72,70000):'';
  const obj={name:f.name.trim(),category:f.category||'',short:f.short||'',desc:f.desc||'',price:f.price||'',badge:f.badge||'',visible:!!f.visible,order:+f.order||0,photoIds:ids,thumb,
   variants:f.variants.filter(v=>v.leafW||v.leafH||v.mountW||v.mountH||v.name),specs:f.specs.filter(s=>s.k&&s.v),updated:Date.now()};
  ed.id=await DB.saveProduct(ed.id,obj);toast('Zapisano ✓');tab='prod';showTab();
 }catch(e){console.error(e);toast('Błąd zapisu: '+(e.code==='permission-denied'?'brak uprawnień (sprawdź reguły Firestore)':e.message),'err')}
 busy(false);
}
/* --- dane i teksty --- */
function viewSite(warn=''){
 draft=structuredClone({...DEF,...S});const d=draft,m=$('#aMain');
 const pairs=(key,title,la,lb,max)=>`<div class="a-card"><h3>${title}</h3><div id="pl-${key}"></div>${max?'':''}<button class="a-btn" data-act="addpair" data-key="${key}">+ Dodaj</button><div class="a-hint">Możesz użyć znaczników: {lat} (liczba lat na rynku), {old} (dawna nazwa), {brand} (nazwa firmy).</div></div>`;
 m.innerHTML=warn+`<div class="a-head"><h2>Dane i teksty</h2></div><div id="siteForm">
 <div class="a-card"><h3>Dane firmy i kontakt</h3><div class="a-grid">
  ${FLD('Nazwa firmy','brand',d.brand)}${FLD('Dawna nazwa (np. AGART)','oldName',d.oldName,{hint:'Zostaw puste, jeśli nie chcesz jej pokazywać.'})}
  ${FLD('Rok rozpoczęcia sprzedaży drzwi','since',d.since,{type:'number',hint:'Z tego liczone jest „od X lat” (rośnie samo co roku).'})}${FLD('Telefon główny (do zamówień)','phone',d.phone,{ph:'+48 000 000 000'})}
  ${FLD('Telefon dodatkowy','phone2',d.phone2)}${FLD('E-mail','email',d.email)}
  ${FLD('Adres (pokaże mapę)','address',d.address,{full:true,hint:'Puste = bez mapy.'})}${FLD('Godziny kontaktu','hours',d.hours)}${FLD('Stopka: NIP / dane firmy','nip',d.nip)}</div></div>
 <div class="a-card"><h3>Strona główna</h3><div class="a-grid">${FLD('Nagłówek','heroTitle',d.heroTitle,{full:true})}${FLD('Opis pod nagłówkiem','heroSub',d.heroSub,{area:true,full:true})}</div></div>
 <div class="a-card"><h3>O firmie</h3><div class="a-grid">${FLD('Tytuł','aboutTitle',d.aboutTitle,{full:true})}${FLD('Tekst (akapity oddziel pustą linią)','aboutText',d.aboutText,{area:true,full:true})}</div></div>
 <div class="a-card"><h3>Kategorie drzwi</h3><div class="a-grid">${FLD('Jedna kategoria w wierszu','categories',d.categories.join('\n'),{area:true,lines:true,full:true,hint:'Kategorie pojawią się jako filtry i w formularzu produktu.'})}</div></div>
 ${pairs('stats','Pasek z liczbami')}${pairs('feats','Dlaczego my (karty)')}${pairs('steps','Jak zamówić (kroki)')}</div>
 <div class="a-save"><button class="a-btn pri" data-act="savesite">Zapisz zmiany</button></div>`;
 bind($('#siteForm'),d);['stats','feats','steps'].forEach(drawPairs);
}
function drawPairs(k){const b=$('#pl-'+k);if(!b)return;b.innerHTML=draft[k].map((r,i)=>`<div class="a-sr"><label>${k==='stats'?'Liczba / hasło':'Tytuł'}<input data-l="${k}" data-i="${i}" data-f="a" value="${esc(r.a)}"></label><label>${k==='stats'?'Opis':'Tekst'}<input data-l="${k}" data-i="${i}" data-f="b" value="${esc(r.b)}"></label><button class="a-x" data-act="delpair" data-key="${k}" data-i="${i}">✕</button></div>`).join('')}
async function saveSite(){busy(true);try{const o={...draft};if(!o.since)o.since=DEF.since;await DB.saveMain(o);Object.assign(S,o);toast('Zapisano ✓')}catch(e){toast('Błąd zapisu: '+(e.code==='permission-denied'?'brak uprawnień (sprawdź reguły Firestore)':e.message),'err')}busy(false)}
/* --- zdjęcia strony --- */
function viewImages(warn=''){
 const box=(k,t,h)=>`<div class="a-card"><h3>${t}</h3>${IMG[k]?`<img src="${IMG[k]}" style="max-width:340px;border-radius:3px;margin-bottom:12px" alt="">`:'<p class="a-mut" style="margin-bottom:12px">Brak zdjęcia (używana jest grafika domyślna).</p>'}<input type="file" accept="image/*" data-up="${k}"> ${IMG[k]?`<button class="a-btn dng" data-act="rmimg" data-k="${k}">Usuń zdjęcie</button>`:''}<div class="a-hint">${h}</div></div>`;
 $('#aMain').innerHTML=warn+`<div class="a-head"><h2>Zdjęcia strony</h2></div>${box('hero','Zdjęcie w tle nagłówka (hero)','Najlepiej poziome, np. hala, magazyn lub drzwi w obiekcie. Zostanie przyciemnione, żeby tekst był czytelny.')}${box('about','Zdjęcie w sekcji „O firmie”','Najlepiej pionowe lub kwadratowe, np. zespół, siedziba lub realizacja.')}`;
 $$('[data-up]').forEach(i=>i.onchange=async e=>{const k=i.dataset.up,f=e.target.files[0];if(!f)return;busy(true);try{const d=await resize(f,k==='hero'?1920:1000,.74,k==='hero'?480000:220000);await DB.saveImages({[k]:d});IMG[k]=d;toast('Zapisano ✓');viewImages(warn)}catch(x){toast('Błąd: '+(x.code==='permission-denied'?'brak uprawnień':x.message),'err')}busy(false)});
}
/* --- kopia --- */
function viewBackup(warn=''){
 $('#aMain').innerHTML=warn+`<div class="a-head"><h2>Kopia zapasowa</h2></div><div class="a-card"><h3>Pobierz kopię</h3><p class="a-mut" style="margin-bottom:12px">Plik JSON z danymi firmy, produktami i zdjęciami. Warto robić go co jakiś czas.</p><button class="a-btn pri" data-act="export">Pobierz kopię</button></div>
 <div class="a-card"><h3>Przywróć z kopii</h3><p class="a-mut" style="margin-bottom:12px">Uwaga: zastąpi obecne dane firmy, a produkty o tych samych ID zostaną nadpisane.</p><input type="file" accept="application/json" id="impFile"></div>`;
 $('#impFile').onchange=async e=>{const f=e.target.files[0];if(!f||!confirm('Przywrócić dane z kopii? Obecne ustawienia zostaną zastąpione.'))return;busy(true);try{await DB.importAll(JSON.parse(await f.text()));toast('Przywrócono ✓');await load()}catch(x){toast('Błąd: '+x.message,'err')}busy(false)};
}
/* --- obsługa kliknięć --- */
$('#admin').addEventListener('click',async e=>{
 const t=e.target.closest('[data-act],[data-tab]');if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;showTab();return}
 const a=t.dataset.act,id=t.dataset.id,i=+t.dataset.i;
 if(a==='close'){e.preventDefault();closeAdmin()}
 else if(a==='login'){try{await A.signInWithPopup(auth,new A.GoogleAuthProvider())}catch(x){toast('Logowanie nie powiodło się: '+x.code,'err')}}
 else if(a==='logout'){await A.signOut(auth)}
 else if(a==='newp')editProduct(null);else if(a==='edit')editProduct(id);else if(a==='back'){tab='prod';showTab()}
 else if(a==='vis'){const p=listCache.find(x=>x.id===id);try{await DB.patch(id,{visible:!p.visible});viewProducts()}catch(x){toast('Błąd zapisu','err')}}
 else if(a==='up'||a==='dn'){const l=listCache,k=l.findIndex(x=>x.id===id),j=a==='up'?k-1:k+1;if(j<0||j>=l.length)return;[l[k],l[j]]=[l[j],l[k]];busy(true);try{for(let n=0;n<l.length;n++)if(l[n].order!==n+1)await DB.patch(l[n].id,{order:n+1});await viewProducts()}catch(x){toast('Błąd zapisu','err')}busy(false)}
 else if(a==='del'){const p=listCache.find(x=>x.id===id);if(!confirm(`Usunąć produkt „${p.name}” wraz ze zdjęciami? Tego nie da się cofnąć.`))return;busy(true);try{for(const pid of p.photoIds||[])await DB.delPhoto(pid);await DB.delProduct(id);toast('Usunięto');await viewProducts()}catch(x){toast('Błąd: '+x.message,'err')}busy(false)}
 else if(a==='phl'||a==='phr'){const j=a==='phl'?i-1:i+1;[ed.photos[i],ed.photos[j]]=[ed.photos[j],ed.photos[i]];drawPh()}
 else if(a==='phx'){const[p]=ed.photos.splice(i,1);if(p.id)ed.removed.push(p.id);drawPh()}
 else if(a==='addvar'){ed.f.variants.push({name:'',leafW:'',leafH:'',mountW:'',mountH:''});drawVar()}
 else if(a==='delvar'){ed.f.variants.splice(i,1);drawVar()}
 else if(a==='addspec'){ed.f.specs.push({k:t.dataset.k||'',v:''});drawSpec()}
 else if(a==='delspec'){ed.f.specs.splice(i,1);drawSpec()}
 else if(a==='savep')saveProduct();
 else if(a==='addpair'){draft[t.dataset.key].push({a:'',b:''});drawPairs(t.dataset.key)}
 else if(a==='delpair'){draft[t.dataset.key].splice(i,1);drawPairs(t.dataset.key)}
 else if(a==='savesite')saveSite();
 else if(a==='rmimg'){busy(true);try{await DB.saveImages({[t.dataset.k]:''});IMG[t.dataset.k]='';toast('Usunięto');viewImages()}catch(x){toast('Błąd','err')}busy(false)}
 else if(a==='export'){busy(true);try{const d=await DB.exportAll();const b=new Blob([JSON.stringify(d)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=`radtom-kopia-${new Date().toISOString().slice(0,10)}.json`;l.click()}catch(x){toast('Błąd: '+x.message,'err')}busy(false)}
});
window.addEventListener('hashchange',()=>{const h=location.hash;if(h==='#admin'&&!$('#admin').classList.contains('on'))openAdmin()});
load();
</script>
</body>
</html>
